<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starship Fleet Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- =========================
         SETTINGS SIDEBAR & BUTTON
    ========================== -->
    <button id="settingsBtn" class="floating-btn">
        <span class="gear-icon">⚙️</span>
    </button>

    <div id="sidebarOverlay"></div>

    <aside id="settingsSidebar">
        <div class="sidebar-header">
            <h2>Settings</h2>
            <button id="closeSidebarBtn">&times;</button>
        </div>

        <div class="setting-item">
            <span class="setting-label">Toggle Theme</span>
            <div class="toggle-wrapper">
                <label class="theme-switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider"></span>
                </label>
                <span id="themeStatusText">Light mode</span>
            </div>
        </div>
    </aside>

    <!-- =========================
         MAIN APPLICATION UI
    ========================== -->
    <header class="modern-header">
        <h1>Starship Fleet Dashboard</h1>
        <p>Explore the galaxy's finest vessels</p>
    </header>

    <main>
        <!-- SEARCH & FILTERS -->
        <section id="controls">
            <input type="text" id="searchInput" placeholder="Search by name (e.g., Falcon)" />

            <select id="crewFilter">
                <option value="all">All Crew Sizes</option>
                <option value="1-5">1-5</option>
                <option value="6-50">6-50</option>
                <option value="50+">50+</option>
            </select>

            <select id="hyperdriveFilter">
                <option value="all">All Hyperdrive Ratings</option>
                <option value="<1.0">&lt; 1.0</option>
                <option value="1.0-2.0">1.0-2.0</option>
                <option value=">2.0">&gt; 2.0</option>
            </select>

            <select id="sortControl">
              <option value="default">Sort By: Default</option>
              <option value="name-asc">Name (A-Z)</option>
              <option value="name-desc">Name (Z-A)</option>
              <option value="crew-asc">Crew (Low to High)</option>
              <option value="crew-desc">Crew (High to Low)</option>
            </select>

            <select id="classFilter">
                <option value="all">All Classes</option>
                <option value="starfighter">Starfighters</option>
                <option value="freighter">Freighters</option>
                <option value="cruiser">Cruisers</option>
            </select>
        </section>

        <!-- UI STATES -->
        <div id="statusMessage"></div>

        <!-- DASHBOARD GRID -->
        <section id="starshipList">
            <!-- Javascript will inject the starships here -->
        </section>

        <!-- PAGINATION -->
        <nav id="pagination">
            <button id="prevBtn" disabled hidden>Previous</button>
            <button id="nextBtn" disabled hidden>Next</button>
        </nav>
    </main>


    <footer class="developer-footer">
      <div class="footer-content">
        <p class="dev-name">Developed by <strong>Rajdeb Gorai</strong></p>
        <p class="dev-collage">National Institute of Technology Patna</p>
        <p class="dev-collage">Brach: MCA (DS & I)-2571056</p>

        <div class="dev-links">
          <a href="https://github.com/Rajdeb-Gorai" target="blank" class="dev-link">GitHub</a>
          <a href="https://www.linkedin.com/in/rajdeb-gorai" target="blank" class="dev-link">linkedin</a>
          <a href="https://leetcode.com/u/Rajdeb_Gorai/" target="blank" class="dev-link">LeetCode</a>

        </div>
      </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
